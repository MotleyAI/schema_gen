[tool.poetry]
name = "schema-gen"
version = "0.1.0"
description = "Generation of database schemas from prompts using the validation loop pattern"
authors = ["James <james@example.com>"]
readme = "README.md"
packages = [{include = "schema_gen"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = ">=2.11.7"
sqlalchemy = ">=2.0.36"
# Instructor 1.10+ eagerly imports all provider shims at top-level `import
# instructor`, which breaks when some optional providers (e.g. mistralai 2.x,
# which dropped top-level symbols) aren't fully installed. We use the latest
# stable release and shim missing provider symbols at import time; see the
# `_shim_missing_providers()` helper in schema_gen/structured_output_with_retries.py.
instructor = ">=1.15.0"
# Versions 1.82.7 and 1.82.8 were compromised (TeamPCP supply-chain attack,
# March 2026) and removed from PyPI. 1.83.0+ uses a new secure CI/CD pipeline.
litellm = ">=1.83.0"
tenacity = ">=9.0.0"
psycopg2-binary = {version = "^2.9.9", optional = true}

[tool.poetry.extras]
postgres = ["psycopg2-binary"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"

[tool.pytest.ini_options]
markers = ["integration: tests that call real LLM APIs (deselect with '-m \"not integration\"')"]
addopts = "-m 'not integration'"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
